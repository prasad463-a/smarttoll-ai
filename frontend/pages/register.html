<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SmartToll AI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom Modern Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg smarttoll-navbar">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="fas fa-microchip text-info"></i>
                <span>SmartToll</span>
                <span class="brand-badge">AI</span>
            </a>
            <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <i class="fas fa-bars fs-4"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarMain">
                <div id="nav-links" class="ms-auto w-100 d-flex justify-content-end">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    <div class="card card-modern p-4 p-md-5 border-0 shadow-lg" id="registerCard">
                        <div class="text-center mb-4">
                            <div class="icon-box icon-box-accent mx-auto mb-3">
                                <i class="fas fa-id-card"></i>
                            </div>
                            <h3 class="fw-bold text-dark mb-1">Create Account</h3>
                            <p class="text-muted small">Join the AI smart toll network and manage your vehicles</p>
                        </div>
                        
                        <div id="alert-container"></div>
                        
                        <form id="registerForm" novalidate>
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control" id="name" required placeholder="John Doe" autocomplete="name">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" required placeholder="name@example.com" autocomplete="email">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone Number (10 Digits)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                    <input type="tel" class="form-control" id="phone" pattern="[0-9]{10}" maxlength="10" required placeholder="9876543210" autocomplete="tel">
                                </div>
                                <div class="form-text small text-muted">Used for real-time gate pass SMS alerts</div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" required placeholder="Choose a secure password" autocomplete="new-password">
                                    <button class="password-toggle-btn" type="button" id="togglePasswordBtn" title="Toggle password visibility">
                                        <i class="fas fa-eye" id="togglePasswordIcon"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-gradient w-100 py-2 btn-pill fw-bold" id="submitBtn">
                                <span>Create Account</span>
                                <i class="fas fa-check ms-1"></i>
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted small mb-0">
                                Already registered? <a href="login.html" class="fw-semibold text-primary">Sign in here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="smarttoll-footer py-3">
        <div class="container text-center small text-muted">
            &copy; 2026 SmartToll AI Systems. All rights reserved.
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { apiRegister } from '../js/api.js';
        import { showAlert, showToast, setupNavbar } from '../js/app.js';

        document.addEventListener('DOMContentLoaded', () => {
            setupNavbar();

            // Password visibility toggle
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePasswordIcon');

            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                toggleIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
            });

            // Form submit
            const form = document.getElementById('registerForm');
            const submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const password = document.getElementById('password').value;

                if (!name || !email || !phone || !password) {
                    showAlert('alert-container', 'Please fill in all required fields.');
                    return;
                }

                if (!/^[0-9]{10}$/.test(phone)) {
                    showAlert('alert-container', 'Please provide a valid 10-digit mobile number.');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Creating account...';

                try {
                    await apiRegister(name, email, phone, password);
                    showToast('Account Created!', 'Your account has been registered successfully.', 'success');
                    
                    document.getElementById('registerCard').innerHTML = `
                        <div class="text-center py-4">
                            <div class="icon-box icon-box-success mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2rem;">
                                <i class="fas fa-check-circle"></i>
                            </div>
                            <h3 class="fw-bold text-dark mb-2">Registration Successful</h3>
                            <p class="text-secondary small mb-4">
                                Welcome, <strong>${name}</strong>! Your account has been securely created in the SmartToll database.
                            </p>
                            <a href="login.html" class="btn btn-primary btn-gradient btn-pill px-5 py-2 shadow-sm">
                                Continue to Sign In <i class="fas fa-arrow-right ms-2"></i>
                            </a>
                        </div>
                    `;
                } catch (err) {
                    console.error('Registration error:', err);
                    showAlert('alert-container', 'Registration failed. Email or phone number might already be in use.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Create Account</span> <i class="fas fa-check ms-1"></i>';
                }
            });
        });
    </script>
</body>
</html>
