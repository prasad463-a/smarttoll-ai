<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Portal - SmartToll AI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom Modern Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg smarttoll-navbar">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="fas fa-microchip text-info"></i>
                <span>SmartToll</span>
                <span class="brand-badge">AI</span>
            </a>
            <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <i class="fas fa-bars fs-4"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarMain">
                <div id="nav-links" class="ms-auto w-100 d-flex justify-content-end">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-5 col-xl-4">
                    <div class="card card-modern p-4 p-md-5 border-0 shadow-lg" style="border-top: 4px solid var(--accent) !important;">
                        <div class="text-center mb-4">
                            <div class="icon-box icon-box-accent mx-auto mb-3" style="width: 58px; height: 58px; font-size: 1.5rem;">
                                <i class="fas fa-torii-gate"></i>
                            </div>
                            <h3 class="fw-bold text-dark mb-1">Operator Portal</h3>
                            <p class="text-muted small">Sign in to operate your assigned toll barrier & ANPR</p>
                        </div>
                        
                        <div id="alert-container"></div>
                        
                        <!-- Quick Credential Auto-Fill helper -->
                        <div class="alert alert-info border-0 p-3 mb-3 rounded-3 small">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <span class="fw-bold d-block"><i class="fas fa-info-circle me-1"></i> Default Operator:</span>
                                    <span>hyderabad@gmail.com</span> / <span>111111</span>
                                </div>
                                <button type="button" class="btn btn-sm btn-outline-info rounded-pill px-2 py-1" id="quickFillBtn">Fill</button>
                            </div>
                        </div>

                        <form id="operatorLoginForm" novalidate>
                            <div class="mb-3">
                                <label for="email" class="form-label">Operator Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" required placeholder="operator@toll.com" autocomplete="username">
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label">Operator Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" required placeholder="Enter password" autocomplete="current-password">
                                    <button class="password-toggle-btn" type="button" id="togglePasswordBtn" title="Toggle password visibility">
                                        <i class="fas fa-eye" id="togglePasswordIcon"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 btn-pill fw-bold" style="background: var(--accent); border-color: var(--accent);" id="submitBtn">
                                <span>Authenticate Plaza</span>
                                <i class="fas fa-key ms-1"></i>
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted small mb-0">
                                Standard vehicle driver? <a href="login.html" class="fw-semibold text-primary">User Login &rarr;</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="smarttoll-footer py-3">
        <div class="container text-center small text-muted">
            &copy; 2026 SmartToll AI Systems. Toll Gate Operator Terminal.
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { apiLoginToll, apiTollLogin } from '../js/api.js';
        import { showAlert, showToast, setupNavbar } from '../js/app.js';

        document.addEventListener('DOMContentLoaded', () => {
            setupNavbar();

            // Quick Fill Button
            const quickFillBtn = document.getElementById('quickFillBtn');
            if (quickFillBtn) {
                quickFillBtn.addEventListener('click', () => {
                    document.getElementById('email').value = 'hyderabad@gmail.com';
                    document.getElementById('password').value = '111111';
                });
            }

            const userStr = sessionStorage.getItem('smartTollUser');
            if (userStr) {
                try {
                    const u = JSON.parse(userStr);
                    if (u.role === 'ROLE_TOLL_OPERATOR') {
                        window.location.href = 'anpr.html';
                        return;
                    }
                } catch {}
            }

            // Password visibility toggle
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePasswordIcon');

            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                toggleIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
            });

            // Form submit
            const form = document.getElementById('operatorLoginForm');
            const submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    showAlert('alert-container', 'Please provide operator credentials.');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';

                try {
                    const response = await apiLoginToll(email, password);
                    if (response && response.token) {
                        sessionStorage.setItem('smartTollUser', JSON.stringify({
                            id: response.id,
                            name: response.name,
                            email: email,
                            role: 'ROLE_TOLL_OPERATOR',
                            token: response.token
                        }));
                        showToast('Plaza Connected', `Authenticated as operator for ${response.name || 'Toll Gate'}.`, 'success');
                        setTimeout(() => {
                            window.location.href = 'anpr.html';
                        }, 600);
                    } else {
                        showAlert('alert-container', 'Invalid operator email or password.');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<span>Authenticate Plaza</span> <i class="fas fa-key ms-1"></i>';
                    }
                } catch (error) {
                    console.error('Operator login error:', error);
                    showAlert('alert-container', error.message || 'Authentication failed. Please check credentials.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Authenticate Plaza</span> <i class="fas fa-key ms-1"></i>';
                }
            });
        });
    </script>
</body>
</html>
